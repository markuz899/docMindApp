name: Release

# Each platform is built on its own runner: better-sqlite3 and node-llama-cpp
# ship per-platform, per-arch binaries, so cross-compiling would produce an
# installer whose native modules are for the wrong machine.
#
# Building and publishing are separate jobs on purpose. When every matrix job
# published for itself, two runners finishing together raced to create the same
# GitHub release and one of them failed. Now the artifacts are collected first
# and a single job publishes them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            label: macOS (Apple Silicon)
            os: macos-14
            flags: --mac --arm64
          - id: linux-x64
            label: Linux (x64)
            os: ubuntu-22.04
            flags: --linux --x64
          - id: win-x64
            label: Windows (x64)
            os: windows-latest
            flags: --win --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs against the Node ABI; packaging swaps it back to Electron's.
      - name: Test
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: Stage native modules for the Electron ABI
        run: npm run native:electron

      - name: Package
        run: npx electron-builder ${{ matrix.flags }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  publish:
    name: Publish release
    needs: build
    timeout-minutes: 30
    # Ship whatever managed to build rather than losing every platform to one
    # failure; the release notes list what is actually attached.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          printf '%s\n' \
            'Unsigned builds: macOS needs its quarantine flag cleared and Windows needs' \
            "SmartScreen's Run anyway. The README has the exact steps." > notes.md

          # </dev/null and a hard timeout: gh prompts on stderr and waits on
          # stdin, so with stderr captured to a file an interactive prompt hangs
          # invisibly - it held a runner for over an hour once.
          if gh release view "$TAG" </dev/null >/dev/null 2>&1; then
            timeout 20m gh release upload "$TAG" artifacts/* --clobber \
              </dev/null 2>gh-error.txt || rc=$?
          else
            timeout 20m gh release create "$TAG" artifacts/* \
              --title "DocMind $TAG" --notes-file notes.md \
              </dev/null 2>gh-error.txt || rc=$?
          fi
          if [ "${rc:-0}" -eq 124 ]; then
            echo "::error::gh timed out after 20 minutes uploading the release"
            exit 1
          fi

          # Job logs need admin rights to read, annotations do not: surface the
          # real reason so a failure here is diagnosable from the API.
          if [ "${rc:-0}" -ne 0 ]; then
            echo "::error::gh release failed ($rc): $(tr '\n' ' ' < gh-error.txt | head -c 800)"
            exit "$rc"
          fi
          cat gh-error.txt
