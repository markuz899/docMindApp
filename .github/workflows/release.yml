name: Release

# Each platform is built on its own runner: better-sqlite3 and node-llama-cpp
# ship per-platform, per-arch binaries, so cross-compiling would produce an
# installer whose native modules are for the wrong machine.
#
# Building and publishing are separate jobs on purpose. When every matrix job
# published for itself, two runners finishing together raced to create the same
# GitHub release and one of them failed. Now the artifacts are collected first
# and a single job publishes them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            label: macOS (Apple Silicon)
            os: macos-14
            flags: --mac --arm64
          - id: linux-x64
            label: Linux (x64)
            os: ubuntu-22.04
            flags: --linux --x64
          - id: win-x64
            label: Windows (x64)
            os: windows-latest
            flags: --win --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs against the Node ABI; packaging swaps it back to Electron's.
      - name: Test
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: Stage native modules for the Electron ABI
        run: npm run native:electron

      - name: Package
        run: npx electron-builder ${{ matrix.flags }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  publish:
    name: Publish release
    needs: build
    timeout-minutes: 30
    # Ship whatever managed to build rather than losing every platform to one
    # failure; the release notes list what is actually attached.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      # gh release create uploads assets sequentially and stalled past twenty
      # minutes on ~480 MB twice, while downloading the same files took two.
      # This action talks to the same API with retries and handles large
      # binaries, which is the one thing gh would not do reliably here.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DocMind ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Unsigned builds. macOS needs its quarantine flag cleared and Windows
            needs SmartScreen's "Run anyway" — the README has the exact steps.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` |
            | Windows | `.exe` |
            | Linux | `.AppImage` / `.deb` |

            Intel Macs are not prebuilt; `npm run dist` on one produces a build.
