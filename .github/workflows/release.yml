name: Release

# Each platform is built on its own runner: better-sqlite3 and node-llama-cpp
# ship per-platform, per-arch binaries, so cross-compiling would produce an
# installer whose native modules are for the wrong machine.
#
# Building and publishing are separate jobs on purpose. When every matrix job
# published for itself, two runners finishing together raced to create the same
# GitHub release and one of them failed. Now the artifacts are collected first
# and a single job publishes them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            label: macOS (Apple Silicon)
            os: macos-14
            flags: --mac --arm64
          - id: linux-x64
            label: Linux (x64)
            os: ubuntu-22.04
            flags: --linux --x64
          - id: win-x64
            label: Windows (x64)
            os: windows-latest
            flags: --win --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs against the Node ABI; packaging swaps it back to Electron's.
      - name: Test
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: Stage native modules for the Electron ABI
        run: npm run native:electron

      - name: Package
        run: npx electron-builder ${{ matrix.flags }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  publish:
    name: Publish release
    needs: build
    timeout-minutes: 30
    # Ship whatever managed to build rather than losing every platform to one
    # failure; the release notes list what is actually attached.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      # Both gh and a dedicated upload action failed here with no usable
      # message, so this is split into two steps on purpose: creating the
      # release proves the token can write, and uploading one file at a time
      # names the file that fails. Notices become check annotations, which are
      # readable from the API without the admin rights job logs need.
      - name: Inventory
        run: |
          for f in artifacts/*; do
            echo "::notice::artifact $(basename "$f") $(du -m "$f" | cut -f1) MB"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' \
            'Unsigned builds: macOS needs its quarantine flag cleared and Windows' \
            "needs SmartScreen's Run anyway. The README has the exact steps." \
            '' \
            'Intel Macs are not prebuilt; npm run dist on one produces a build.' > notes.md

          if gh release view "$TAG" </dev/null >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists"
            exit 0
          fi
          if ! timeout 5m gh release create "$TAG" \
                 --title "DocMind $TAG" --notes-file notes.md \
                 </dev/null 2>err.txt; then
            echo "::error::could not create the release: $(tr '\n' ' ' < err.txt | head -c 500)"
            exit 1
          fi
          echo "::notice::release $TAG created"

      - name: Upload the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          failed=0
          for f in artifacts/*; do
            name=$(basename "$f")
            start=$SECONDS
            if timeout 15m gh release upload "$TAG" "$f" --clobber </dev/null 2>err.txt; then
              echo "::notice::uploaded $name in $((SECONDS - start))s"
            else
              failed=1
              echo "::error::upload failed for $name after $((SECONDS - start))s: $(tr '\n' ' ' < err.txt | head -c 400)"
            fi
          done
          exit "$failed"
