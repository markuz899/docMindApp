appId: dev.docmind.app
productName: DocMind
copyright: MIT licensed
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'
# better-sqlite3 and llama.cpp load real binaries; they cannot live inside asar.
asarUnpack:
  - '**/*.node'
  - node_modules/node-llama-cpp/**

publish:
  provider: github
  owner: markuz899
  repo: docMindApp
  releaseType: release

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  # dmg only: the .zip exists for electron-updater, which DocMind does not use,
  # and it doubles what the release job has to upload.
  target:
    - dmg
  category: public.app-category.developer-tools
  # Unsigned: there is no Apple Developer identity. electron-builder still
  # ad-hoc signs, which is what arm64 needs to launch at all. Users must clear
  # the download quarantine flag once - see the README.
  identity: null
  darkModeSupport: true

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: markuz899 <markuz899@users.noreply.github.com>
  synopsis: Ask your project's documentation
  desktop:
    entry:
      StartupWMClass: DocMind

# The Electron-ABI binaries are staged by scripts/native.mjs before packaging.
# Gives the unsigned macOS bundle a valid ad-hoc signature (see the script).
afterPack: scripts/after-pack.js

npmRebuild: false
